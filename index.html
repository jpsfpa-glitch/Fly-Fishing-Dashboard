<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utah Fly Fishing Dashboard</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3133/3133182.png">
    <link id="manifest-link" rel="manifest" href="">

    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Soft grayish blue */
            color: #334155;
        }
        .river-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .river-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .water-texture {
            background-image: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-10 text-center md:text-left flex flex-col md:flex-row items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-800 tracking-tight flex items-center justify-center md:justify-start gap-3">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Utah Fly Fishing Dashboard
                </h1>
                <p class="text-slate-500 mt-2 font-medium text-sm md:text-base">Real-time reports, flows, and forecasts for top Utah tailwaters.</p>
            </div>
            <div class="mt-4 md:mt-0 text-sm font-semibold text-blue-700 bg-blue-50 px-4 py-2 rounded-full border border-blue-100 shadow-inner">
                Last Updated: Today
            </div>
        </header>

        <!-- Dashboard Grid -->
        <main id="dashboard-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8">
            <!-- Cards will be injected here by JavaScript -->
        </main>
    </div>

    <script>
        // Mapping Open-Meteo WMO weather codes to emojis and descriptions
        const weatherCodes = {
            0: { icon: "☀️", text: "Clear" },
            1: { icon: "⛅", text: "Mostly Clear" },
            2: { icon: "⛅", text: "Partly Cloudy" },
            3: { icon: "☁️", text: "Overcast" },
            45: { icon: "🌫️", text: "Fog" },
            51: { icon: "🌧️", text: "Light Drizzle" },
            61: { icon: "🌧️", text: "Light Rain" },
            63: { icon: "🌧️", text: "Rain" },
            71: { icon: "❄️", text: "Light Snow" },
            73: { icon: "❄️", text: "Snow" },
            95: { icon: "⛈️", text: "Thunderstorm" }
        };

        function getWeatherFromCode(code) {
            return weatherCodes[code] || { icon: "☁️", text: "Cloudy" };
        }

        // Data structure containing the requested river information, USGS site IDs, and coordinates
        const riverData = [
            {
                id: "green-river",
                name: "Green River",
                sections: "Sections A and B",
                usgsId: "09234500", // Green River near Greendale, UT
                lat: 40.91, lon: -109.43,
                optimalFlow: [800, 2500],
                reportSource: "Dutch John Guides",
                report: "Nymph rigs and streamers effective. Midge hatch at 10am. BWO hatches starting on cloudy afternoons.",
                flies: ["Haslam's Midge", "Tungsten Zebra Midge", "Cheech Leech"],
                techniques: "Retrieve streamers slowly, use nymph rigs at 9 feet deep."
            },
            {
                id: "provo-river",
                name: "Provo River",
                sections: "Middle and Lower Sections",
                usgsId: "10111500", // Provo River below Deer Creek
                lat: 40.40, lon: -111.53,
                optimalFlow: [100, 400],
                reportSource: "FishTech Outfitters",
                report: "Consistent flow, good nymphing in the deeper slots. Look for rising fish in the tailouts.",
                flies: ["Nuke Egg", "Rainbow Warrior", "Sparkle Pupa", "Zebra Midge"],
                techniques: "Indicator nymphing (2-fly) with 4X-5X tippet."
            },
            {
                id: "weber-river",
                name: "Weber River",
                sections: "Below Rockport / Wanship",
                usgsId: "10128500", // Weber River near Coalville (Rockport)
                lat: 40.79, lon: -111.39,
                optimalFlow: [100, 350],
                reportSource: "Trout Creek Flies",
                report: "Flows are highly dependent on agricultural pull. Focus on faster riffles and deeper pools.",
                flies: ["Midges (#22-24)", "Sow Bugs (#20-24)"],
                techniques: "Light tippet and careful presentations."
            },
            {
                id: "bear-river",
                name: "Bear River",
                sections: "Wyoming/Utah Border",
                usgsId: "10011500", // Bear River near UT/WY State Line
                lat: 41.05, lon: -110.97,
                optimalFlow: [200, 800],
                reportSource: "Local Anglers",
                report: "Holding steady, fair clarity. Bigger bugs are working along the undercut banks.",
                flies: ["Pat's Rubber Legs", "Streamers", "Chubby Chernobyl"],
                techniques: "Focus on seams and structure."
            },
            {
                id: "logan-river",
                name: "Logan River",
                sections: "Logan Canyon",
                usgsId: "10109000", // Logan River above State Dam
                lat: 41.74, lon: -111.79,
                optimalFlow: [50, 250],
                reportSource: "Cache Valley Guides",
                report: "Great pocket water fishing. The dry-dropper bite is picking up significantly in the upper canyon.",
                flies: ["Stimulator", "Frenchie", "Small midges"],
                techniques: "Target moderate stable flows and tailouts behind boulders."
            },
            {
                id: "strawberry-river",
                name: "Strawberry River",
                sections: "Below Strawberry Reservoir",
                usgsId: "10113500", // Near Duchesne
                lat: 40.16, lon: -111.13,
                optimalFlow: [40, 150],
                reportSource: "Strawberry Bay Marina",
                report: "Low flow conditions, use light gear. Stealth is absolutely mandatory right now.",
                flies: ["Small nymphs", "Midges", "Scuds"],
                techniques: "Indicator nymph (2-fly), stealthy approaches."
            }
        ];

        // Fetch Live USGS Flow Data
        async function fetchFlowData(siteId) {
            try {
                const response = await fetch(`https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteId}&parameterCd=00060`);
                
                if (!response.ok) {
                    throw new Error(`USGS API returned status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Safely access the deeply nested flow value using optional chaining
                const flowValue = data?.value?.timeSeries?.[0]?.values?.[0]?.value?.[0]?.value;
                
                if (flowValue === undefined || flowValue === null) {
                    throw new Error("Flow data temporarily unavailable for this site.");
                }
                
                return parseInt(flowValue);
            } catch (error) {
                console.error("Error fetching flow for " + siteId, error);
                return "N/A";
            }
        }

        // Fetch Live Open-Meteo Weather Data
        async function fetchWeatherData(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=America%2FDenver`);
                
                if (!response.ok) {
                    throw new Error(`Weather API returned status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data || !data.daily) {
                    throw new Error("No daily weather data found in response");
                }
                
                const weather = [];
                for(let i=0; i<3; i++) {
                    const wData = getWeatherFromCode(data.daily.weather_code[i]);
                    weather.push({
                        day: i === 0 ? "Today" : i === 1 ? "Tomorrow" : "Day 3",
                        high: Math.round(data.daily.temperature_2m_max[i] * 9/5 + 32), // Convert C to F
                        low: Math.round(data.daily.temperature_2m_min[i] * 9/5 + 32),
                        condition: wData.text,
                        icon: wData.icon
                    });
                }
                return weather;
            } catch (error) {
                console.error("Error fetching weather", error);
                return Array(3).fill({ day: "-", high: "-", low: "-", condition: "Unknown", icon: "❓" });
            }
        }

        // Determine Flow Status dynamically based on CFS
        function getFlowStatus(cfs, optimalRange) {
            if (cfs === "N/A") return "Unknown";
            if (cfs < optimalRange[0]) return "Low";
            if (cfs > optimalRange[1]) return "High";
            return "Optimal";
        }

        // Function to determine badge color based on flow status
        function getFlowBadgeClass(status) {
            switch(status.toLowerCase()) {
                case 'optimal':
                    return 'bg-green-100 text-green-800 border-green-200';
                case 'low':
                    return 'bg-red-100 text-red-800 border-red-200';
                case 'high':
                    return 'bg-yellow-100 text-yellow-800 border-yellow-200';
                default:
                    return 'bg-slate-100 text-slate-800 border-slate-200';
            }
        }

        // Function to generate individual river card HTML
        function createRiverCard(data) {
            const badgeClass = getFlowBadgeClass(data.flowStatus);
            
            const fliesList = data.flies.map(fly => 
                `<span class="inline-block bg-slate-100 text-slate-700 rounded-full px-3 py-1 text-xs font-semibold mr-2 mb-2 border border-slate-200">${fly}</span>`
            ).join('');
            
            const weatherHTML = data.weather.map(w => `
                <div class="text-center p-2 bg-slate-50 rounded border border-slate-100">
                    <div class="text-xs text-slate-500 font-semibold uppercase tracking-wider">${w.day}</div>
                    <div class="text-2xl my-1" title="${w.condition}">${w.icon}</div>
                    <div class="text-xs font-medium"><span class="text-red-500">${w.high}°</span> / <span class="text-blue-500">${w.low}°</span></div>
                </div>
            `).join('');

            return `
                <article class="river-card bg-white rounded-2xl overflow-hidden border border-slate-200 flex flex-col h-full">
                    <!-- Card Header / Water Texture -->
                    <div class="water-texture p-6 border-b border-blue-100">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800">${data.name}</h2>
                                <p class="text-blue-800 font-medium text-sm mt-1">${data.sections}</p>
                            </div>
                            <span class="px-3 py-1 text-xs font-bold rounded-full border shadow-sm ${badgeClass}">
                                ${data.flowStatus}
                            </span>
                        </div>
                    </div>
                    
                    <div class="p-6 flex-grow flex flex-col">
                        <!-- Conditions Grid -->
                        <div class="grid grid-cols-1 gap-4 mb-6">
                            <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100/50 flex justify-between items-center">
                                <div>
                                    <span class="block text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Live USGS Flow</span>
                                    <span class="text-2xl font-bold text-blue-700">${data.cfs} <span class="text-sm font-normal text-blue-500">CFS</span></span>
                                </div>
                                <div class="text-right">
                                    <span class="block text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Optimal Range</span>
                                    <span class="text-sm font-medium text-slate-700">${data.optimalFlow[0]} - ${data.optimalFlow[1]} CFS</span>
                                </div>
                            </div>
                        </div>

                        <!-- Weather Forecast -->
                        <div class="mb-6">
                            <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2 mb-3">Live 3-Day Forecast</h3>
                            <div class="grid grid-cols-3 gap-2">
                                ${weatherHTML}
                            </div>
                        </div>

                        <!-- Fishing Report -->
                        <div class="mb-6">
                            <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2 mb-2">Shop/Guide Report</h3>
                            <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider block mb-2">Via: ${data.reportSource}</span>
                            <p class="text-sm text-slate-600 leading-relaxed">${data.report}</p>
                        </div>

                        <!-- Recommended Flies & Techniques -->
                        <div class="mt-auto">
                            <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2 mb-3">🪰 Recommended Flies</h3>
                            <div class="flex flex-wrap mb-3">
                                ${fliesList}
                            </div>
                            <div class="bg-amber-50 p-3 rounded-lg border border-amber-100 text-sm">
                                <span class="font-bold text-amber-800">Technique:</span> <span class="text-amber-900">${data.techniques}</span>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        // Initialize Dashboard and Fetch Live Data
        async function initDashboard() {
            const dashboardGrid = document.getElementById('dashboard-grid');
            dashboardGrid.innerHTML = '<div class="col-span-full text-center p-12 text-slate-500 font-medium animate-pulse">Loading live river and weather data...</div>';
            
            const liveRiverData = await Promise.all(riverData.map(async (river) => {
                const cfs = await fetchFlowData(river.usgsId);
                const weather = await fetchWeatherData(river.lat, river.lon);
                const flowStatus = getFlowStatus(cfs, river.optimalFlow);
                
                return { ...river, cfs, weather, flowStatus };
            }));

            let htmlContent = '';
            liveRiverData.forEach(river => {
                htmlContent += createRiverCard(river);
            });

            dashboardGrid.innerHTML = htmlContent;
            
            // Update timestamp
            document.querySelector('.text-blue-700.bg-blue-50').textContent = `Last Updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        // Run when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            initDashboard();
            setupPWA();
        });

        // Setup Progressive Web App (PWA) Manifest dynamically for single-file use
        function setupPWA() {
            const manifest = {
                name: "Utah Fly Fishing Dashboard",
                short_name: "FlyFish UT",
                start_url: ".",
                display: "standalone",
                background_color: "#f0f4f8",
                theme_color: "#3b82f6",
                description: "Real-time reports, flows, and forecasts for top Utah tailwaters.",
                icons: [{
                    src: "https://cdn-icons-png.flaticon.com/512/3133/3133182.png", // Placeholder fishing icon
                    sizes: "512x512",
                    type: "image/png"
                }]
            };
            
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);
            document.getElementById('manifest-link').setAttribute('href', manifestURL);
        }

    </script>
</body>
</html>
